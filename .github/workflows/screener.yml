name: Screener

on:
  schedule:
    # Chaque jour à 3 h 13 UTC (4 h 13 à Paris en hiver, 5 h 13 en été)
    - cron: "13 3 * * *"
    # Rattrapage à 9 h 13 UTC : GitHub retarde ou saute parfois les tâches de nuit.
    # Ne fait rien si le passage complet du jour a déjà eu lieu.
    - cron: "13 9 * * *"
  workflow_dispatch: # bouton « Run workflow » pour lancer à la main
    inputs:
      minutes:
        description: "Durée maximale de collecte (minutes)"
        default: "300"
  push:
    branches: [main]
    # Lancement court quand le planning ou le site changent, pour publier tout de suite
    paths: [".github/workflows/screener.yml", "web/**"]

permissions:
  contents: write   # pour sauvegarder les données dans le dépôt
  pages: write      # pour publier le site
  id-token: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  garde:
    runs-on: ubuntu-latest
    outputs:
      passer: ${{ steps.verif.outputs.passer }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - id: verif
        name: Le passage du jour a-t-il déjà eu lieu ?
        run: |
          passer=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            fait=$(python3 -c "import json; print(json.load(open('data/statut.json')).get('passage_complet') or '')" 2>/dev/null || true)
            if [ "$fait" = "$(date -u +%F)" ]; then
              passer=true
              echo "Le passage complet du jour a déjà eu lieu : rien à faire."
            fi
          fi
          echo "passer=$passer" >> "$GITHUB_OUTPUT"

  calculer:
    needs: garde
    if: needs.garde.outputs.passer != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier les calculs (tests automatiques)
        run: |
          for t in tests/test_*.py; do python "$t"; done

      - name: Récupérer les données détaillées (branche « donnees »)
        run: |
          if git fetch -q --depth 1 origin donnees; then
            git show FETCH_HEAD:donnees.csv > data/donnees.csv
            echo "$(wc -l < data/donnees.csv) lignes récupérées."
          else
            echo "Pas encore de données détaillées."
          fi

      - name: Indicateurs économiques de la page d'accueil (un échec n'interrompt pas le calcul)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python macro.py

      - name: Collecter les données et calculer les notes
        env:
          # Lancement automatique après une modification du planning ou du site : court (15 min)
          BUDGET_MINUTES: ${{ github.event_name == 'push' && '15' || inputs.minutes || '300' }}
          # Après une modification du site ou du planning : on republie seulement, sans relire
          # les données. Seules les tâches programmées de GitHub mettent les données à jour.
          SANS_COLLECTE: ${{ github.event_name == 'push' && '1' || '' }}
        run: python main.py

      - name: Contrôle de santé (données anormales = site non republié et e-mail d'alerte)
        env:
          SANS_COLLECTE: ${{ github.event_name == 'push' && '1' || '' }}
        run: python sante.py avant-publication

      - name: Sauvegarder les données
        if: always()
        env:
          JETON: ${{ github.token }}
        run: |
          git config user.name "screener-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Données détaillées : la branche « donnees » est remplacée à chaque fois,
          # pour ne pas alourdir le dépôt d'un historique inutile
          if [ -s data/donnees.csv ]; then
            tmp=$(mktemp -d)
            cp data/donnees.csv "$tmp/"
            git -C "$tmp" init -q -b donnees
            git -C "$tmp" add donnees.csv
            git -C "$tmp" -c user.name="screener-bot" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Données détaillées du $(date +%F)"
            git -C "$tmp" push -q --force \
              "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" donnees
          fi
          git add data
          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle."
          else
            git commit -q -m "Données du $(date +%F)"
            git pull -q --rebase --autostash
            git push -q
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publier:
    needs: calculer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4

  surveiller:
    # Alerte par e-mail (le lancement échoue) si Yahoo bloque depuis plusieurs nuits
    needs: publier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Contrôle de santé sur plusieurs nuits
        run: python3 sante.py plusieurs-nuits
