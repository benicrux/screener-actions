name: Screener

on:
  schedule:
    # Chaque jour à 3 h 13 UTC (4 h 13 à Paris en hiver, 5 h 13 en été)
    - cron: "13 3 * * *"
  workflow_dispatch: # bouton « Run workflow » pour lancer à la main
    inputs:
      minutes:
        description: "Durée maximale de collecte (minutes)"
        default: "300"
  push:
    branches: [main]
    # Lancement court quand le planning ou le site changent, pour publier tout de suite
    paths: [".github/workflows/screener.yml", "web/**"]

permissions:
  contents: write   # pour sauvegarder les données dans le dépôt
  pages: write      # pour publier le site
  id-token: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  calculer:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer les données détaillées (branche « donnees »)
        run: |
          if git fetch -q --depth 1 origin donnees; then
            git show FETCH_HEAD:donnees.csv > data/donnees.csv
            echo "$(wc -l < data/donnees.csv) lignes récupérées."
          else
            echo "Pas encore de données détaillées."
          fi

      - name: Collecter les données et calculer les notes
        env:
          # Lancement automatique après une modification du planning ou du site : court (15 min)
          BUDGET_MINUTES: ${{ github.event_name == 'push' && '15' || inputs.minutes || '300' }}
        run: python main.py

      - name: Sauvegarder les données
        if: always()
        env:
          JETON: ${{ github.token }}
        run: |
          git config user.name "screener-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Données détaillées : la branche « donnees » est remplacée à chaque fois,
          # pour ne pas alourdir le dépôt d'un historique inutile
          if [ -s data/donnees.csv ]; then
            tmp=$(mktemp -d)
            cp data/donnees.csv "$tmp/"
            git -C "$tmp" init -q -b donnees
            git -C "$tmp" add donnees.csv
            git -C "$tmp" -c user.name="screener-bot" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Données détaillées du $(date +%F)"
            git -C "$tmp" push -q --force \
              "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" donnees
          fi
          git add data
          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle."
          else
            git commit -q -m "Données du $(date +%F)"
            git pull -q --rebase --autostash
            git push -q
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publier:
    needs: calculer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
