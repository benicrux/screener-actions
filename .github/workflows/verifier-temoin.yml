name: Vérifier le portefeuille témoin (temporaire)

on:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cours de départ et derniers cours chez Yahoo
        run: python temoin.py --verifier
